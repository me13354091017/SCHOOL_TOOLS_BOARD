name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web bundle
        run: node build.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 在 Linux 上交叉编译 Windows WPF 版（自包含单文件，用户无需装 .NET）
      - name: Publish WPF (win-x64, self-contained)
        continue-on-error: true
        run: |
          dotnet publish wpf/InkBoard.Wpf.csproj -c Release -r win-x64 \
            --self-contained true \
            -p:EnableWindowsTargeting=true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o pub-wpf

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.json _site/
          cp -r src icons dist _site/
          if [ -f pub-wpf/InkBoard.exe ]; then
            mkdir -p _site/download
            cp pub-wpf/InkBoard.exe _site/download/inkboard-wpf.exe
            curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o _site/download/LICENSE.txt || cp LICENSE _site/download/LICENSE.txt
            ls -lh _site/download/inkboard-wpf.exe _site/download/LICENSE.txt
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
