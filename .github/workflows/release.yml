name: Release

on:
  push:
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web bundle
        run: node build.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WPF (win-x64, self-contained)
        run: |
          dotnet publish wpf/InkBoard.Wpf.csproj -c Release -r win-x64 \
            --self-contained true \
            -p:EnableWindowsTargeting=true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o pub-wpf

      - name: Package assets
        run: |
          mkdir -p rel
          cp pub-wpf/InkBoard.exe "rel/InkBoard-WPF-${VERSION}.exe"
          cp dist/inkboard-standalone.html "rel/InkBoard-Web-${VERSION}.html"
          curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o "rel/LICENSE.txt" || cp LICENSE "rel/LICENSE.txt"
          ls -lh rel

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" rel/* \
            --title "墨板 InkBoard v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
