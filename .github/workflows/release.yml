name: Release

on:
  push:
    paths:
      - 'VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web bundle
        run: node build.mjs

      - name: Fetch ICC-CE desktop package and installer
        run: |
          # 桌面版（主应用）在 fork 仓库构建：zip 为主程序包，Setup exe 为 Inno Setup 安装包
          # 直连 release 下载地址（与 tag 绑定），避免匿名 GitHub API 被限流
          base="https://github.com/me13354091017/community/releases/download/stb-latest"
          zip_url="$base/SchoolToolsBoard-STB-win-x64.zip"
          exe_url="$base/SchoolToolsBoard-STB-Setup-${VERSION}.exe"
          echo "zip: $zip_url"
          echo "exe: $exe_url"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/stb-desktop.zip "$zip_url" || { echo "::error::desktop zip download failed"; exit 1; }
          if curl -fL --retry 3 --retry-delay 5 -o /tmp/stb-setup.exe "$exe_url"; then
            echo 'installer fetched'
          else
            echo "::warning::installer ${VERSION} not found in stb-latest, continue without it"
            rm -f /tmp/stb-setup.exe
          fi
          ls -lh /tmp/stb-desktop.zip || true
          ls -lh /tmp/stb-setup.exe || true

      - name: Package assets
        run: |
          mkdir -p rel
          cp /tmp/stb-desktop.zip "rel/SchoolToolsBoard-STB-Desktop-${VERSION}.zip"
          if [ -s /tmp/stb-setup.exe ]; then
            cp /tmp/stb-setup.exe "rel/SchoolToolsBoard-Setup-${VERSION}.exe"
          fi
          cp dist/stb-standalone.html "rel/SchoolToolsBoard-Web-${VERSION}.html"
          curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o "rel/LICENSE.txt" || cp LICENSE "rel/LICENSE.txt"
          ls -lh rel

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" rel/* --clobber
            gh release edit "v${VERSION}" \
              --title "SchoolToolsBoard（STB）课堂白板 v${VERSION}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "v${VERSION}" rel/* \
              --title "SchoolToolsBoard（STB）课堂白板 v${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi

      - name: Drop legacy WPF asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自研 WPF 版已下线，清掉历史 Release 里残留的 exe
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            for name in $(gh release view "$tag" --json assets -q '.assets[].name' | grep -i wpf); do
              gh release delete-asset "$tag" "$name" -y || true
              echo "removed $tag/$name"
            done
          done
