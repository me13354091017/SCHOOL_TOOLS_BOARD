name: WPF Build

on:
  push:
    branches: [main]
    paths:
      - 'wpf/**'
      - '.github/workflows/wpf.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        run: dotnet --list-sdks

      - name: Install ImageMagick
        continue-on-error: true
        run: choco install imagemagick -y --no-progress

      - name: Generate app icon
        continue-on-error: true
        run: magick -background none icons/icon.svg -define icon:auto-resize=256,128,64,48,32,16 wpf/Assets/app.ico

      - name: Build
        run: dotnet build wpf/InkBoard.Wpf.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolToolsBoard-wpf
          path: wpf/bin/Release/net10.0-windows10.0.19041.0/
          if-no-files-found: warn
